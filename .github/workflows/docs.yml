name: Docs (Sphinx) -> GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + docs deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "sphinx==5.0.2"

      - name: Build HTML
        run: |
          sphinx-build -b html docs/source docs/_build/html

      - name: Disable Jekyll (keep _static and _sources)
        run: |
          touch docs/_build/html/.nojekyll

      - name: Debug (prove index + _static exist)
        run: |
          ls -la docs/_build/html | head -n 50
          test -f docs/_build/html/index.html
          test -d docs/_build/html/_static

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4